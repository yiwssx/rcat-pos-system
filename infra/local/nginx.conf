# Mounted only by compose.local.yaml; application images stay unchanged.
# BusyBox wget in the existing Alpine image has no custom CA option. Keep the
# liveness probe on container loopback; CI exercises the real public TLS path.
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /healthz {
        alias /usr/share/nginx/local/start.html;
        default_type text/html;
    }
    location / { return 404; }
}

server {
    listen 8080 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/local-tls/cert.pem;
    ssl_certificate_key /etc/nginx/local-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != localhost) { return 444; }
    access_log off;
    error_log /dev/stderr crit;
    server_tokens off;
    client_max_body_size 256k;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rcat_api "http://api:3000";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;

    location = /local {
        alias /usr/share/nginx/local/start.html;
        default_type text/html;
    }
    location = /api/auth/google/start { return 302 /local; }
    location /api/auth/google/ { return 404; }
    location /api/ {
        proxy_pass $rcat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /sw.js { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
