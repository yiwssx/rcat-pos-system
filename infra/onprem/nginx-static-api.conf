# Container-side HTTP ONLY. Approved RCAT RMS ingress must terminate HTTPS,
# authenticate the host boundary, and restrict this service to the staging LAN.
# No raw URLs, query strings, session cookies or visitor identifiers in logs.
server {
    listen 8080;
    server_name _;
    access_log off;
    server_tokens off;
    client_max_body_size 256k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rcat_api "http://api:3000";

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Use a regex only for the known Merchant SSE route. No proxy buffering;
    # durable PostgreSQL Outbox + client replay remains authoritative.
    location ~ ^/api/tenants/[0-9a-f-]+/stores/[0-9a-f-]+/notifications/stream$ {
        proxy_pass $rcat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass $rcat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Merchant service worker must revalidate. Other frontends return 404.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hashed Angular output is immutable; non-hashed navigation never is.
    location ~* "^/(?:main|polyfills|chunk|styles)-[a-zA-Z0-9_-]{8,}\.(?:js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
