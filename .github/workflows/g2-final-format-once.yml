name: G2 one-time source formatting
on:
  push:
    branches: [feat/g2-product-media-printable-table-qr]
    paths: ['.github/workflows/g2-final-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'yiwssx/rcat-pos-system' && github.ref == 'refs/heads/feat/g2-product-media-printable-table-qr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned formatter without scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format G2 WebP implementation and tests only
        run: |
          pnpm exec prettier --write \
            apps/api/src/catalog/webp-validation.ts \
            apps/api/src/catalog/webp-validation.spec.ts \
            apps/merchant/src/app/prepare-product-webp.ts \
            apps/merchant/src/app/app.spec.ts
      - name: Commit exact formatter output to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/catalog/webp-validation.ts \
                  apps/api/src/catalog/webp-validation.spec.ts \
                  apps/merchant/src/app/prepare-product-webp.ts \
                  apps/merchant/src/app/app.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(g2): canonical Prettier format for WebP fixes'
          git push origin HEAD:refs/heads/feat/g2-product-media-printable-table-qr
