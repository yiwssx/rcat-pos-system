# Single-shot formatter: remove immediately after the exact-file commit.
name: One-time G2 Guest QR formatting
on:
  push:
    branches:
      - fix/g2-static-qr-recovery-ios-light-20261116
    paths:
      - .github/workflows/g2-guest-format-once.yml
permissions:
  contents: write
concurrency:
  group: g2-ios-format-once
  cancel-in-progress: true
jobs:
  format:
    if: github.repository == 'yiwssx/rcat-pos-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier to only the affected Angular template
        run: pnpm exec prettier --write apps/customer/src/app/guest-order.page.ts
      - name: Commit only approved formatting
        run: |
          git add -- apps/customer/src/app/guest-order.page.ts
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'style(guest): normalize QR recovery template with repo Prettier'
          git fetch origin refs/heads/fix/g2-static-qr-recovery-ios-light-20261116
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/fix/g2-static-qr-recovery-ios-light-20261116
