name: Temporary SSE TypeScript formatting preview
on:
  pull_request:
    paths:
      - 'apps/api/src/orders/merchant-notification-stream*'
      - 'apps/api/src/orders/merchant-notifications*'
      - 'apps/merchant/src/app/order-board.page.ts'
      - '.github/workflows/sse-format-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Canonical Prettier output for merchant SSE source
        shell: bash
        run: |
          files=(
            apps/api/src/orders/merchant-notification-stream.core.ts
            apps/api/src/orders/merchant-notification-stream.service.ts
            apps/api/src/orders/merchant-notification-stream.spec.ts
            apps/api/src/orders/merchant-notifications.service.ts
            apps/api/src/orders/merchant-notifications.controller.ts
            apps/merchant/src/app/order-board.page.ts
          )
          pnpm exec prettier --write "${files[@]}"
          for f in "${files[@]}"; do
            echo "RCAT_SSE_FORMAT_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "RCAT_SSE_FORMAT_END:$f"
          done
