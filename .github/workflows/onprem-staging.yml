name: On-prem staging container packaging

on:
  workflow_dispatch:  # Owner-triggered signed Staging candidate; no automatic publishing
  pull_request:
    paths:
      - 'Dockerfile.staging'
      - 'compose.local.yaml'
      - 'compose.portal.yaml'
      - '.env.portal.example'
      - 'infra/local/**'
      - 'scripts/dev/local-seed.mjs'
      - 'scripts/ops/local-demo.sh'
      - 'tests/ops/local-demo*'
      - 'compose.staging.yaml'
      - '.dockerignore'
      - '.env.staging.example'
      - 'infra/onprem/**'
      - 'scripts/ops/onprem-*'
      - 'tests/ops/onprem-*'
      - 'apps/**'
      - '.node-version'
      - 'angular.json'
      - 'nx.json'
      - 'tsconfig.base.json'
      - 'pnpm-workspace.yaml'
      - 'libs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/onprem-staging.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile.staging'
      - 'compose.local.yaml'
      - 'compose.portal.yaml'
      - '.env.portal.example'
      - 'infra/local/**'
      - 'scripts/dev/local-seed.mjs'
      - 'scripts/ops/local-demo.sh'
      - 'tests/ops/local-demo*'
      - 'compose.staging.yaml'
      - '.dockerignore'
      - '.env.staging.example'
      - 'infra/onprem/**'
      - 'scripts/ops/onprem-*'
      - 'tests/ops/onprem-*'
      - 'apps/**'
      - 'libs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/onprem-staging.yml'

permissions:
  contents: read

concurrency:
  group: onprem-staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-inspect:
    if: github.event_name != 'workflow_dispatch'
    name: Stage images, Nginx configuration and isolation
    # Match the pinned Playwright runner's supported OS, independent of latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether image contents changed
        id: impact
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/impact-policy.mjs "$BASE_SHA" "$GITHUB_SHA"
      - name: Reuse previous image evidence for operator-only changes
        if: steps.impact.outputs.onprem_images == 'false'
        run: echo "No Docker image inputs changed; Foundation runs the affected operations safety tests."
      - name: Build API and three independent Angular/Nginx staging images
        if: steps.impact.outputs.onprem_images == 'true'
        run: |
          set -euo pipefail
          docker build -f Dockerfile.staging --target api -t rcat-pos-api:staging-ci .
          for app in customer merchant admin; do
            docker build -f Dockerfile.staging --target "$app" -t "rcat-pos-$app:staging-ci" .
          done
      - name: Verify non-root compiled API and three static Nginx sites
        if: steps.impact.outputs.onprem_images == 'true'
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint node rcat-pos-api:staging-ci -e "require('fs').accessSync('/work/dist/apps/api/src/main.js'); if(process.getuid()===0) process.exit(1)"
          for app in customer merchant admin; do
            docker run --rm --entrypoint nginx "rcat-pos-$app:staging-ci" -t
            docker run --rm --entrypoint sh "rcat-pos-$app:staging-ci" -c 'test -s /usr/share/nginx/html/index.html'
          done
          docker run --rm --entrypoint sh rcat-pos-merchant:staging-ci -c 'test -s /usr/share/nginx/html/sw.js'
          for app in admin; do
            docker run --rm --entrypoint sh "rcat-pos-$app:staging-ci" -c 'test ! -e /usr/share/nginx/html/sw.js'
          done
      - name: Start the isolated Local demo with its real Compose configuration
        if: steps.impact.outputs.onprem_images == 'true'
        run: bash scripts/ops/local-demo.sh up
      - uses: actions/setup-node@v4
        if: steps.impact.outputs.onprem_images == 'true'
        with:
          node-version-file: .node-version
      - name: Install pinned browser runner for the Local demo only
        if: steps.impact.outputs.onprem_images == 'true'
        run: |
          npm install --prefix /tmp/rcat-local-playwright --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          /tmp/rcat-local-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify Local login, seeded menu, Order acceptance and repeat bootstrap
        if: steps.impact.outputs.onprem_images == 'true'
        env:
          NODE_PATH: /tmp/rcat-local-playwright/node_modules
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.secrets/local-demo/cert.pem
        run: node tests/ops/local-demo-browser.cjs
      - name: Stop only the Local demo containers
        if: always() && steps.impact.outputs.onprem_images == 'true'
        run: bash scripts/ops/local-demo.sh stop
      - name: Show only Local container health on failure (no environment dump)
        if: failure() && steps.impact.outputs.onprem_images == 'true'
        run: |
          for id in $(docker ps -aq --filter label=com.docker.compose.project=rcat-pos-local); do
            docker inspect --format '{{.Name}} {{json .State.Health}}' "$id"
          done

      - name: Upload unified portal screenshots (synthetic CI data only)
        if: always() && steps.impact.outputs.onprem_images == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unified-portal-${{ github.run_id }}
          path: /tmp/rcat-portal-*.png
          if-no-files-found: ignore
          retention-days: 7

  signed-release:
    name: Manually sign four Staging OCI image digests (never deploy)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'yiwssx'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed without exact-main accepted On-prem CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          observed="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$observed" = "$GITHUB_SHA"
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/onprem-staging.yml/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&status=success&per_page=20")"
          jq -e --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "push")] | length > 0' <<< "$runs" > /dev/null
          test -f Dockerfile.staging
          test -f .dockerignore
          grep -Fxq '.secrets' .dockerignore
          grep -Fxq '.env' .dockerignore
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact-SHA api image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.staging
          target: api
          push: true
          provenance: true
          tags: ghcr.io/${{ github.repository }}-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Attest actual api registry manifest digest
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - name: Publish exact-SHA customer image
        id: customer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.staging
          target: customer
          push: true
          provenance: true
          tags: ghcr.io/${{ github.repository }}-customer:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Attest actual customer registry manifest digest
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-customer
          subject-digest: ${{ steps.customer.outputs.digest }}
          push-to-registry: true
      - name: Publish exact-SHA merchant image
        id: merchant
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.staging
          target: merchant
          push: true
          provenance: true
          tags: ghcr.io/${{ github.repository }}-merchant:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Attest actual merchant registry manifest digest
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-merchant
          subject-digest: ${{ steps.merchant.outputs.digest }}
          push-to-registry: true
      - name: Publish exact-SHA admin image
        id: admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.staging
          target: admin
          push: true
          provenance: true
          tags: ghcr.io/${{ github.repository }}-admin:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Attest actual admin registry manifest digest
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-admin
          subject-digest: ${{ steps.admin.outputs.digest }}
          push-to-registry: true
