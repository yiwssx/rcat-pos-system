name: Temporary formatter export for PR 137
on:
  push:
    branches:
      - refactor/spartan-staff-home-20261118
    paths:
      - .github/workflows/temporary-prettier-pr137.yml
permissions:
  contents: read
jobs:
  format-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Print exact pinned Prettier source
        run: |
          pnpm exec prettier apps/customer/src/app/portal-home.page.ts > /tmp/rcat-staff-home-format.ts
          node -e "const fs=require('node:fs');console.log('FORMATTED_SOURCE='+JSON.stringify(fs.readFileSync('/tmp/rcat-staff-home-format.ts','utf8')))"
