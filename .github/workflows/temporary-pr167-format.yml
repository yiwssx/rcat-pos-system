name: PR167 format-only helper
on:
  push:
    branches: [fix/102-single-theme-reconciliation]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only three PR files (read-only, emit source)
        run: |
          set -eu
          for file in apps/merchant/src/app/merchant-finance.page.ts apps/merchant/src/app/merchant-payment-receiver.page.html apps/merchant/src/app/payment-review.page.ts; do
            pnpm exec prettier --write "$file"
            printf 'RCATFORMAT:%s:' "$file"
            base64 -w0 "$file"
            printf '\n'
          done
