name: Temporary customer frontend formatter
on:
  pull_request:
    paths:
      - 'apps/customer/src/**'
      - '.github/workflows/customer-format-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Emit canonical Prettier outputs for changed Customer files
        shell: bash
        run: |
          files=(
            apps/customer/src/app/app.routes.ts
            apps/customer/src/app/app.spec.ts
            apps/customer/src/app/guest-order.api.ts
            apps/customer/src/app/guest-order.css
            apps/customer/src/app/guest-order.domain.ts
            apps/customer/src/app/guest-order.page.ts
            apps/customer/src/app/guest-track.page.ts
            apps/customer/src/app/home.page.ts
            apps/customer/src/app/status.page.ts
          )
          pnpm exec prettier --write "${files[@]}"
          for f in "${files[@]}"; do
            echo "RCAT_FMT_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "RCAT_FMT_END:$f"
          done
