name: Temporary G2 dependency lock generation
on:
  push:
    branches: [feat/g2-product-media-printable-table-qr]
    paths: ['package.json', '.github/workflows/g2-lock-generate.yml']
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'yiwssx/rcat-pos-system' && github.ref == 'refs/heads/feat/g2-product-media-printable-table-qr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Generate deterministic lockfile, without package scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit lockfile to this same feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git diff --cached --exit-code && exit 0
          git commit -m 'chore(g2): pnpm lockfile for pinned QR encoder'
          git push origin HEAD:refs/heads/feat/g2-product-media-printable-table-qr
