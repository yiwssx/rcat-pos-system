name: One-time auth PostgreSQL dependency lockfile
on:
  push:
    branches: [feat/g1-restricted-auth-http]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'yiwssx/rcat-pos-system' && github.actor == 'yiwssx'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Refresh exact dependency lockfile without lifecycle scripts
        run: pnpm install --ignore-scripts --no-frozen-lockfile
      - name: Format new authentication source files
        run: |
          pnpm exec prettier --write 'apps/api/src/auth/**/*.ts' 'apps/api/src/database/**/*.ts' apps/api/src/app.module.ts apps/api/tsconfig.app.json apps/api/project.json package.json scripts/smoke-auth.mjs scripts/smoke-api.mjs .github/workflows/database.yml
      - name: Commit pinned lockfile and source formatting
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml apps/api/src/auth apps/api/src/database apps/api/src/app.module.ts apps/api/tsconfig.app.json apps/api/project.json package.json scripts/smoke-auth.mjs scripts/smoke-api.mjs .github/workflows/database.yml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(auth): lock audited PostgreSQL client dependency'
          git push "https://x-access-token:${GH_TOKEN}@github.com/yiwssx/rcat-pos-system.git" HEAD:refs/heads/feat/g1-restricted-auth-http
# This elevated workflow MUST be removed from the PR before merge to main.
