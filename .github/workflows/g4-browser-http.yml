name: G4 Browser and HTTP Ordering E2E

on:
  pull_request:
    paths:
      - 'tests/e2e/**'
      - '.github/workflows/g4-browser-http.yml'
      - 'apps/customer/**'
      - 'apps/merchant/**'
      - 'apps/api/**'
      - 'db/**'
      - 'scripts/db/**'
      - 'scripts/ops/ci-nginx-sse.conf'
      - 'pnpm-lock.yaml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - '.github/workflows/g4-browser-http.yml'
      - 'apps/customer/**'
      - 'apps/merchant/**'
      - 'apps/api/**'
      - 'db/**'
      - 'scripts/db/**'
      - 'scripts/ops/ci-nginx-sse.conf'
      - 'pnpm-lock.yaml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: g4-browser-http-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-http-ordering:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: rcat_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rcat_ci_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      CI: 'true'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: rcat_ci_test
      PGPASSWORD: test-only-ci-password
      NODE_PATH: /tmp/rcat-g4-playwright/node_modules
      NODE_EXTRA_CA_CERTS: /tmp/rcat-g4-cert.pem
      NX_DAEMON: 'false'
      GUEST_TABLE_CODE_PEPPER: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL client and real nginx SSE proxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client nginx
          nginx -t -c "$PWD/scripts/ops/ci-nginx-sse.conf"
      - name: Apply database migrations
        run: bash scripts/db/migrate.sh
      - name: Seed isolated tenants and demo users in disposable CI only
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/tenant-isolation.sql
      - name: Provision development-only HTTP fixture roles
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/http-auth-fixtures.sql
      - name: Compile API
        run: pnpm exec tsc -p apps/api/tsconfig.app.json
      - name: Install isolated, pinned Playwright test runner and Chromium
        run: |
          npm install --prefix /tmp/rcat-g4-playwright --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          /tmp/rcat-g4-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Generate ephemeral loopback HTTPS certificate for Secure staff cookies
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout /tmp/rcat-g4-key.pem -out /tmp/rcat-g4-cert.pem \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          chmod 600 /tmp/rcat-g4-key.pem
      - name: Exercise Merchant Service Worker cache and activation invariants
        run: node tests/pwa-service-worker.mjs
      - name: Exercise Chromium mobile/desktop and real HTTP checkout
        run: node tests/e2e/g4-browser-http.cjs
      - name: Upload UI failure screenshots (CI dummy data only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: g4-browser-failure-${{ github.run_id }}
          path: /tmp/rcat-e2e-*.png
          if-no-files-found: ignore
          retention-days: 5
