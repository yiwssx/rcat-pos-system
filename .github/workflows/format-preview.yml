name: Temporary merchant UI formatting preview
on:
  pull_request:
    paths:
      - 'apps/merchant/src/**'
      - '.github/workflows/format-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show canonical Prettier contents for UI only
        shell: bash
        run: |
          files=(
            apps/merchant/src/app/app.component.ts
            apps/merchant/src/app/app.spec.ts
            apps/merchant/src/app/home.page.ts
            apps/merchant/src/app/merchant-order.api.ts
            apps/merchant/src/app/order-board.domain.ts
            apps/merchant/src/app/order-board.page.ts
            apps/merchant/src/app/status.page.ts
          )
          pnpm exec prettier --write "${files[@]}"
          for f in "${files[@]}"; do
            echo "RCAT_FORMAT_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "RCAT_FORMAT_END:$f"
          done
