name: Temporary G3 Exception Return Formatting
on:
  pull_request:
    paths:
      - '.github/workflows/temp-exception-return-format.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/g3-preparation-exception-stock-return'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/g3-preparation-exception-stock-return
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed inventory code
        run: |
          pnpm exec prettier --write \
            apps/api/src/inventory/inventory.core.ts \
            apps/api/src/inventory/inventory.core.spec.ts \
            apps/api/src/inventory/inventory.service.ts \
            apps/api/src/inventory/inventory.controller.ts \
            apps/merchant/src/app/exception-returns.page.ts \
            apps/merchant/src/app/app.spec.ts \
            apps/merchant/src/app/inventory.domain.ts \
            apps/merchant/src/app/inventory.api.ts \
            apps/merchant/src/app/app.routes.ts \
            apps/merchant/src/app/order-board.page.ts \
            apps/merchant/src/app/order-board.css
      - name: Commit canonical style if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/inventory apps/merchant/src/app
          if ! git diff --cached --quiet; then
            git commit -m 'style(g3): canonical Prettier formatting for exception returns'
            git push origin HEAD:refs/heads/feat/g3-preparation-exception-stock-return
          fi
