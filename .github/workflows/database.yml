name: PostgreSQL tenant-isolation tests
on:
  pull_request:
    paths:
      - 'db/**'
      - 'scripts/db/**'
      - 'tests/db/**'
      - '.github/workflows/database.yml'
      - 'apps/api/src/auth/**'
      - 'apps/api/src/merchant/**'
      - 'apps/api/src/catalog/**'
      - 'apps/api/src/ordering/**'
      - 'apps/api/src/orders/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/src/database/**'
      - 'apps/api/tsconfig.app.json'
      - 'libs/server-auth/**'
      - 'scripts/smoke-auth.mjs'
      - 'scripts/dev/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'db/**'
      - 'scripts/db/**'
      - 'tests/db/**'
      - '.github/workflows/database.yml'
      - 'apps/api/src/auth/**'
      - 'apps/api/src/merchant/**'
      - 'apps/api/src/catalog/**'
      - 'apps/api/src/ordering/**'
      - 'apps/api/src/orders/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/src/database/**'
      - 'apps/api/tsconfig.app.json'
      - 'libs/server-auth/**'
      - 'scripts/smoke-auth.mjs'
      - 'scripts/dev/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
jobs:
  postgres-rls:
    name: PostgreSQL 16 migration and RLS integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: rcat_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rcat_ci_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: rcat_ci_test
      PGPASSWORD: test-only-ci-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Apply migrations
        run: bash scripts/db/migrate.sh
      - name: Confirm repeat-safe checksummed migrations
        run: bash scripts/db/migrate.sh
      - name: Verify tenant isolation and app privileges
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/tenant-isolation.sql
      - name: Verify isolated authentication session schema and role grants
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/auth-sessions.sql
      - name: Verify authenticated membership RLS boundary
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/auth-memberships.sql
      - name: Provision isolated auth HTTP test roles
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/http-auth-fixtures.sql
      - name: Verify atomic merchant provisioning and invitation permissions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/onboarding-functions.sql
      - name: Verify pending email registration SQL security
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/email-registration.sql
      - name: Verify owner-only staff management SQL transactions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/staff-administration.sql
      - name: Verify password recovery SQL security
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/password-recovery.sql
      - name: Verify Google Workspace identity binding, anti-recycle and session isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/google-workspace-identity.sql
      - name: Verify catalog scope, satang integrity and RLS using PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/catalog.sql
      - name: Verify per-visit ordering tokens and tenant isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/ordering-visits.sql
      - name: Verify product modifiers, tenant isolation and guest visibility
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/product-modifiers.sql
      - name: Verify order money, idempotency, snapshots and tenant isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/guest-orders.sql
      - name: Verify merchant Order inbox, authorized transitions and audit
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/order-fulfilment.sql
      - name: Verify Order-scoped guest tracking tokens, isolation and rotation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/guest-order-tracking.sql
      - name: Verify single-visit Bill aggregation, idempotency, audit and RLS
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/operational-bills.sql
      - name: Verify merchant/guest Order history, audit ordering and privacy
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/order-status-history.sql
      - name: Verify durable Order outbox, rollback, replay, and tenant-scoped acknowledgements
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/order-outbox.sql
      - name: Verify authenticated merchant store discovery and kitchen permissions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/merchant-store-scopes.sql
      - name: Verify 65-Order same-timestamp keyset pagination and security isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/order-inbox-pagination.sql
      - name: Verify Bangkok business-day operational reports, Order reconciliation and tenant roles
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/operational-reports.sql
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile API and server-only libraries
        run: pnpm exec tsc -p apps/api/tsconfig.app.json
      - name: Provision first development merchant account using stdin
        env:
          CI: 'true'
        run: |
          printf '%s\n' 'example-password-2026' | pnpm exec tsx scripts/dev/provision-account.ts --email 'newmerchant@test.invalid'
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM rcat.users WHERE email='newmerchant@test.invalid'" | grep -qx '1'
      - name: Verify HTTP login, CSRF, session and cross-tenant isolation
        env:
          CI: 'true'
        run: node scripts/smoke-auth.mjs
      - name: Verify new tenant and invitation audit events
        run: |
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM rcat.audit_events" | grep -qx '24'
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT count(DISTINCT action) FROM rcat.audit_events WHERE action IN ('tenant.created','staff.invited','staff.invitation.accepted','staff.role.changed','staff.removed')" | grep -qx '5'
      - name: Verify real Google Workspace OIDC code, PKCE, scoped Session, replay and subject binding
        env:
          CI: 'true'
        run: node scripts/smoke-google-oauth.mjs
