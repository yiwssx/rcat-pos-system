name: PostgreSQL tenant-isolation tests
on:
  pull_request:
    paths:
      - 'db/**'
      - 'scripts/db/**'
      - 'tests/db/**'
      - '.github/workflows/database.yml'
      - 'apps/api/src/auth/**'
      - 'apps/api/src/merchant/**'
      - 'apps/api/src/catalog/**'
      - 'apps/api/src/ordering/**'
      - 'apps/api/src/orders/**'
      - 'apps/api/src/inventory/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/src/database/**'
      - 'apps/api/tsconfig.app.json'
      - 'libs/server-auth/**'
      - 'scripts/smoke-auth.mjs'
      - 'scripts/smoke-inventory.mjs'
      - 'scripts/load/concurrent-orders.mjs'
      - 'scripts/ops/g4-retention-maintenance.mjs'
      - 'scripts/dev/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'db/**'
      - 'scripts/db/**'
      - 'tests/db/**'
      - '.github/workflows/database.yml'
      - 'apps/api/src/auth/**'
      - 'apps/api/src/merchant/**'
      - 'apps/api/src/catalog/**'
      - 'apps/api/src/ordering/**'
      - 'apps/api/src/orders/**'
      - 'apps/api/src/inventory/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/src/database/**'
      - 'apps/api/tsconfig.app.json'
      - 'libs/server-auth/**'
      - 'scripts/smoke-auth.mjs'
      - 'scripts/smoke-inventory.mjs'
      - 'scripts/load/concurrent-orders.mjs'
      - 'scripts/ops/g4-retention-maintenance.mjs'
      - 'scripts/dev/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
jobs:
  postgres-rls:
    name: PostgreSQL 16 migration and RLS integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: rcat_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rcat_ci_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: rcat_ci_test
      PGPASSWORD: test-only-ci-password
      GUEST_TABLE_CODE_PEPPER: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Apply migrations
        run: bash scripts/db/migrate.sh
      - name: Confirm repeat-safe checksummed migrations
        run: bash scripts/db/migrate.sh
      - name: Verify tenant isolation and app privileges
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/tenant-isolation.sql
      - name: Verify isolated authentication session schema and role grants
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/auth-sessions.sql
      - name: Verify authenticated membership RLS boundary
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/auth-memberships.sql
      - name: Provision isolated auth HTTP test roles
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/http-auth-fixtures.sql
      - name: Verify atomic merchant provisioning and invitation permissions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/onboarding-functions.sql
      - name: Verify pending email registration SQL security
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/email-registration.sql
      - name: Verify owner-only staff management SQL transactions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/staff-administration.sql
      - name: Verify password recovery SQL security
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/password-recovery.sql
      - name: Verify Google Workspace identity binding, anti-recycle and session isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/google-workspace-identity.sql
      - name: Verify catalog scope, satang integrity and RLS using PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/catalog.sql
      - name: Verify merchant catalog versioned edit, soft archive, RLS and immutable old Order snapshots
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/catalog-product-lifecycle.sql
      - name: Verify 45-item staff Catalog keyset paging and tenant/store isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/catalog-keyset-paging.sql
      - name: Verify audited CAS editing for categories and Modifier group/options
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/catalog-editor.sql
      - name: Verify DBA-only retention of Guest abuse buckets and protected cleanup
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/guest-budget-maintenance.sql
      - name: Verify shared Guest rate budgets and 55-row tenant-isolated Guest keyset pages
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/guest-catalog-budgets.sql
      - name: Verify cart-only Guest review, scoped modifiers and withdrawn products
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/guest-cart-review.sql
      - name: Verify printable QR code rotation, per-device grants, failed-attempt cap and Order continuity
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/printable-table-codes.sql
      - name: Verify restricted WebP product images, archived/sold-out reads and size cap
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/product-webp-media.sql
      - name: Verify per-visit ordering tokens and tenant isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/ordering-visits.sql
      - name: Verify product modifiers, tenant isolation and guest visibility
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/product-modifiers.sql
      - name: Verify order money, idempotency, snapshots and tenant isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/guest-orders.sql
      - name: Verify required guest identity, delivery and per-item snapshot recovery
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/guest-order-context.sql
      - name: Verify stable per-store human Order numbers and replay safety
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/order-display-numbers.sql
      - name: Verify dormant G5-M1 merchant PromptPay receiver scope, CAS and RLS
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/g5-merchant-receiver.sql
      - name: Verify guest Order scoped dual-gated Payment Request and kitchen independence
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/g5-guest-payment-request.sql
      - name: Verify private G5 slip review and bank-check transitions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/g5-private-slip-review.sql
      - name: Verify manual finance refund and exception reconciliation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/g5-manual-finance-ledger.sql
      - name: Verify read-only operator Outbox retention preview and runtime privilege isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/outbox-retention-preview.sql
      - name: Verify merchant Order inbox, authorized transitions and audit
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/order-fulfilment.sql
      - name: Verify Order-scoped guest tracking tokens, isolation and rotation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/guest-order-tracking.sql
      - name: Verify single-visit Bill aggregation, idempotency, audit and RLS
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/operational-bills.sql
      - name: Verify merchant/guest Order history, audit ordering and privacy
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/order-status-history.sql
      - name: Verify durable Order outbox, rollback, replay, and tenant-scoped acknowledgements
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/order-outbox.sql
      - name: Verify authenticated merchant store discovery and kitchen permissions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/merchant-store-scopes.sql
      - name: Verify 65-Order same-timestamp keyset pagination and security isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/order-inbox-pagination.sql
      - name: Verify Bangkok business-day operational reports, Order reconciliation and tenant roles
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/operational-reports.sql
      - name: Verify inventory ledger, recipes, idempotency, tenant and role isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/inventory-ledger.sql
      - name: Verify atomic Order stock reservation, modifier recipe and cancellation snapshot
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/order-stock-reservation.sql
      - name: Verify multi-ingredient shortage rollback and tenant permissions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/order-stock-shortage.sql
      - name: Verify dual-control stocktakes, stale revisions, audit and tenant isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/inventory-stocktake.sql
      - name: Verify exceptional post-preparation stock returns, dual approval and exact allocation ceiling
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/order-exception-stock-return.sql
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile API and server-only libraries
        run: pnpm exec tsc -p apps/api/tsconfig.app.json
      - name: Provision first development merchant account using stdin
        env:
          CI: 'true'
        run: |
          printf '%s\n' 'example-password-2026' | pnpm exec tsx scripts/dev/provision-account.ts --email 'newmerchant@test.invalid'
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM rcat.users WHERE email='newmerchant@test.invalid'" | grep -qx '1'
      - name: Verify HTTP login, CSRF, session and cross-tenant isolation
        env:
          CI: 'true'
        run: node scripts/smoke-auth.mjs
      - name: Verify new tenant and invitation audit events
        run: |
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM rcat.audit_events WHERE action NOT IN ('catalog.product.updated','catalog.product.archived')" | grep -qx '29'
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM rcat.audit_events WHERE action IN ('catalog.product.updated','catalog.product.archived')" | grep -qx '2'
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT count(DISTINCT action) FROM rcat.audit_events WHERE action IN ('tenant.created','staff.invited','staff.invitation.accepted','staff.role.changed','staff.removed')" | grep -qx '5'
      - name: Provision isolated RCAT Workspace staff after legacy audit-count tests
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/google-http-fixtures.sql
      - name: Verify real Google Workspace OIDC code, PKCE, scoped Session, replay and subject binding
        env:
          CI: 'true'
        run: node scripts/smoke-google-oauth.mjs
      - name: Verify real inventory HTTP authorization, replay, quantity and recipe recovery
        env:
          CI: 'true'
        run: node scripts/smoke-inventory.mjs
      - name: Exercise 24 parallel guest Orders, stock contention and duplicate merchant actions
        env:
          CI: 'true'
          RCAT_LOAD_CLIENTS: '24'
        run: node scripts/load/concurrent-orders.mjs
      - name: Exercise 64 concurrent requests with 16 live database sessions
        env:
          CI: 'true'
          RCAT_LOAD_CLIENTS: '64'
        run: node scripts/load/concurrent-orders.mjs
