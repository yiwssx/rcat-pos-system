name: Temporary Stocktake Prettier
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-stocktake-prettier.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/g3-stocktake-dual-control'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/g3-stocktake-dual-control
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format stocktake code only
        run: |
          pnpm exec prettier --write \
            apps/api/src/inventory/inventory.controller.ts \
            apps/api/src/inventory/inventory.core.spec.ts \
            apps/api/src/inventory/inventory.core.ts \
            apps/api/src/inventory/inventory.service.ts \
            apps/merchant/src/app/app.spec.ts \
            apps/merchant/src/app/inventory.api.ts \
            apps/merchant/src/app/inventory.css \
            apps/merchant/src/app/inventory.domain.ts \
            apps/merchant/src/app/inventory.page.ts \
            apps/merchant/src/app/stocktake.css \
            apps/merchant/src/app/stocktake.page.ts
      - name: Commit canonical formatting if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/inventory apps/merchant/src/app
          if ! git diff --cached --quiet; then
            git commit -m 'style(g3): canonical Prettier formatting for stocktake'
            git push origin HEAD:refs/heads/feat/g3-stocktake-dual-control
          fi
