# Temporary, single-trigger dependency lock bootstrap.
# The workflow is REMOVED after it has written a reviewed lock to this one feature branch.
name: One-time RCAT Spartan dependency lock
on:
  push:
    branches:
      - feat/ux-spartan-foundation-rcat-brand-20261114
    paths:
      - .github/workflows/ui-foundation-bootstrap.yml
permissions:
  contents: write
concurrency:
  group: one-time-spartan-lock
  cancel-in-progress: true
jobs:
  update-lock:
    if: github.repository == 'yiwssx/rcat-pos-system' && github.ref == 'refs/heads/feat/ux-spartan-foundation-rcat-brand-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore original verified dependencies
        run: pnpm install --frozen-lockfile
      - name: Add Spartan Brain for Angular and Tailwind v4, pin CLI
        run: |
          pnpm add -w @angular/cdk@~22.2.0 @spartan-ng/brain@1.9.0
          pnpm add -Dw @spartan-ng/cli@1.9.0 tailwindcss@^4.1.0 @tailwindcss/postcss@^4.1.0 postcss@^8.5.0
          pnpm install --frozen-lockfile
      - name: Commit only reproducible package manifest and lock to feature branch
        run: |
          git add -- package.json pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(ui): lock Spartan Brain, CLI, CDK and Tailwind v4'
          git push origin HEAD:refs/heads/feat/ux-spartan-foundation-rcat-brand-20261114
