name: Temporary operational reporting formatting
on:
  pull_request:
    paths:
      - 'apps/api/src/orders/operational-*'
      - 'apps/merchant/src/app/operational-*'
      - '.github/workflows/report-format-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Emit formatted current source
        shell: bash
        run: |
          files=(
            apps/api/src/orders/operational-report.core.ts
            apps/api/src/orders/operational-report.core.spec.ts
            apps/api/src/orders/operational-reports.controller.ts
            apps/api/src/orders/operational-reports.service.ts
            apps/merchant/src/app/app.routes.ts
            apps/merchant/src/app/app.spec.ts
            apps/merchant/src/app/home.page.ts
            apps/merchant/src/app/operational-report.domain.ts
            apps/merchant/src/app/operational-reports.api.ts
            apps/merchant/src/app/operational-reports.css
            apps/merchant/src/app/operational-reports.page.ts
          )
          pnpm exec prettier --write "${files[@]}"
          for f in "${files[@]}"; do
            echo "RCAT_REPORT_FORMAT_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "RCAT_REPORT_FORMAT_END:$f"
          done
