# Temporary one-shot, branch-scoped formatting job. Remove before PR merge.
name: Temporary PR128 Prettier
on:
  push:
    branches:
      - feat/real-workspace-payment-ux-20261118
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[pr128-formatted]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout specific branch
        uses: actions/checkout@v7
        with:
          ref: feat/real-workspace-payment-ux-20261118
          persist-credentials: true
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.23.0
          run_install: false
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed UI files only
        run: |
          pnpm exec prettier --write \
            apps/customer/src/app/app.component.ts \
            apps/customer/src/app/guest-order.page.ts \
            apps/customer/src/app/guest-track.page.ts \
            apps/customer/src/app/platform-access.page.ts \
            apps/customer/src/app/portal-home.page.ts \
            apps/customer/src/styles.css \
            apps/merchant/src/app/merchant-payment-receiver.page.html
      - name: Commit only formatter changes
        run: |
          set -euo pipefail
          git add -- \
            apps/customer/src/app/app.component.ts \
            apps/customer/src/app/guest-order.page.ts \
            apps/customer/src/app/guest-track.page.ts \
            apps/customer/src/app/platform-access.page.ts \
            apps/customer/src/app/portal-home.page.ts \
            apps/customer/src/styles.css \
            apps/merchant/src/app/merchant-payment-receiver.page.html
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "style(ui): apply Prettier to affected files [pr128-formatted]"
            git push origin HEAD:refs/heads/feat/real-workspace-payment-ux-20261118
          fi
