name: One-time merchant source formatter
on:
  push:
    branches: [feat/g1-merchant-onboarding-invitations]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'yiwssx/rcat-pos-system' && github.actor == 'yiwssx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format only merchant TypeScript source
        run: pnpm exec prettier --write 'apps/api/src/merchant/**/*.ts'
      - name: Commit format to feature branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git add apps/api/src/merchant
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(merchant): format onboarding source'
          git push "https://x-access-token:${GH_TOKEN}@github.com/yiwssx/rcat-pos-system.git" HEAD:refs/heads/feat/g1-merchant-onboarding-invitations
# Remove one-time write capability from PR before merge.
