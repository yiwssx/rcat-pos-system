name: Workspace quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    name: Nx build, tests, types, formatting and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_DAEMON: 'false'
      NX_SKIP_NX_CACHE: 'true'
    steps:
      - name: Checkout (history for Nx affected)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute minimum required verification from changed files
        id: impact
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/impact-policy.mjs "$BASE_SHA" "$GITHUB_SHA"
      - name: Reuse established CI evidence (no Nx inputs changed)
        if: steps.impact.outputs.workspace == 'false'
        run: echo "Workspace task is not applicable to this commit; specialized workflows retain their own scope."
      - name: Install pnpm
        if: steps.impact.outputs.workspace == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - name: Node.js
        if: steps.impact.outputs.workspace == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install from committed lockfile
        if: steps.impact.outputs.workspace == 'true'
        run: pnpm install --frozen-lockfile
      # TEMPORARY: export Prettier's exact changed-file output for a clean source commit.
      - name: Export formatting delta for QR PR
        if: github.event_name == 'pull_request' && steps.impact.outputs.workspace == 'true'
        run: |
          pnpm exec prettier --write             apps/customer/src/app/guest-order.api.ts             apps/customer/src/app/guest-order.page.ts             apps/customer/src/app/guest-order.css             apps/merchant/src/app/merchant-tables.api.ts             apps/merchant/src/app/merchant-tables.page.ts             apps/merchant/src/app/merchant-tables.css             apps/api/src/ordering/table-ordering.service.ts
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const path of [
            'apps/customer/src/app/guest-order.api.ts',
            'apps/customer/src/app/guest-order.page.ts',
            'apps/customer/src/app/guest-order.css',
            'apps/merchant/src/app/merchant-tables.api.ts',
            'apps/merchant/src/app/merchant-tables.page.ts',
            'apps/merchant/src/app/merchant-tables.css',
            'apps/api/src/ordering/table-ordering.service.ts',
          ]) {
            const raw = readFileSync(path).toString('base64');
            for (let i = 0; i < raw.length; i += 2400) {
              console.log('RCAT_FMT|' + path + '|' + (i / 2400) + '|' + raw.slice(i, i + 2400));
            }
          }
          NODE
      - name: Display Nx projects
        if: steps.impact.outputs.workspace == 'true'
        run: pnpm exec nx show projects
      - name: Test changed projects in PR
        if: github.event_name == 'pull_request' && steps.impact.outputs.workspace == 'true' && steps.impact.outputs.decision == 'scoped'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec nx affected -t build typecheck test lint smoke --base="$BASE_SHA" --head=HEAD --parallel=3
      - name: Verify affected projects on main
        if: github.event_name == 'push' && steps.impact.outputs.workspace == 'true' && steps.impact.outputs.decision == 'scoped'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: pnpm exec nx affected -t build typecheck test lint smoke --base="$BASE_SHA" --head=HEAD --parallel=3
      - name: Fail-closed full project checks when the commit base is unavailable
        if: steps.impact.outputs.workspace == 'true' && steps.impact.outputs.decision == 'fail_closed'
        run: pnpm exec nx run-many -t build typecheck test lint smoke --parallel=3
# Specialized database, recovery and browser workflows remain independent security gates.
