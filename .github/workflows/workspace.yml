name: Workspace quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    name: Nx build, tests, types, formatting and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_DAEMON: 'false'
      NX_SKIP_NX_CACHE: 'true'
    steps:
      - name: Checkout (history for Nx affected)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute minimum required verification from changed files
        id: impact
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/impact-policy.mjs "$BASE_SHA" "$GITHUB_SHA"
      - name: Reuse established CI evidence (no Nx inputs changed)
        if: steps.impact.outputs.workspace == 'false'
        run: echo "Workspace task is not applicable to this commit; specialized workflows retain their own scope."
      - name: Install pnpm
        if: steps.impact.outputs.workspace == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.23.0
          run_install: false
      - name: Node.js
        if: steps.impact.outputs.workspace == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install from committed lockfile
        if: steps.impact.outputs.workspace == 'true'
        run: pnpm install --frozen-lockfile
      - name: Export V7 formatter patch (temporary read-only engineering handoff)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 162 && steps.impact.outputs.workspace == 'true'
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            apps/admin/src/app/home.page.ts
            apps/admin/src/app/staff.page.ts
            apps/customer/src/app/app.component.ts
            apps/customer/src/app/guest-order.page.ts
            apps/customer/src/app/guest-track.page.ts
            apps/customer/src/app/platform-access.page.ts
            apps/customer/src/app/portal-home.page.ts
            apps/customer/src/app/portal-workspace-nav.component.ts
            apps/merchant/src/app/inventory.page.ts
            apps/merchant/src/app/order-board.page.ts
          )
          pnpm exec prettier --version
          pnpm exec prettier --write "${paths[@]}"
          pnpm exec prettier --check "${paths[@]}"
          git diff --no-ext-diff --no-color --unified=0 -- "${paths[@]}" > /tmp/rcat-v7-format.patch
          test -s /tmp/rcat-v7-format.patch
          echo RCAT_V7_FORMAT_PATCH_BEGIN
          base64 -w 900 /tmp/rcat-v7-format.patch
          echo
          echo RCAT_V7_FORMAT_PATCH_END
          git restore --worktree -- "${paths[@]}"
          git diff --exit-code -- "${paths[@]}"
      - name: Verify the installed deepmerge prototype guard
        if: steps.impact.outputs.workspace == 'true'
        run: node scripts/ci/verify-deepmerge-security.cjs
      - name: Display Nx projects
        if: steps.impact.outputs.workspace == 'true'
        run: pnpm exec nx show projects
      - name: Test changed projects in PR
        if: github.event_name == 'pull_request' && steps.impact.outputs.workspace == 'true' && steps.impact.outputs.decision == 'scoped'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec nx affected -t build typecheck test lint smoke --base="$BASE_SHA" --head=HEAD --parallel=3
      - name: Verify affected projects on main
        if: github.event_name == 'push' && steps.impact.outputs.workspace == 'true' && steps.impact.outputs.decision == 'scoped'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: pnpm exec nx affected -t build typecheck test lint smoke --base="$BASE_SHA" --head=HEAD --parallel=3
      - name: Fail-closed full project checks when the commit base is unavailable
        if: steps.impact.outputs.workspace == 'true' && steps.impact.outputs.decision == 'fail_closed'
        run: pnpm exec nx run-many -t build typecheck test lint smoke --parallel=3
# Specialized database, recovery and browser workflows remain independent security gates.
