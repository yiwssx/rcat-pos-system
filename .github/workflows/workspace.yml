name: Workspace quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    name: Nx build, tests, types, formatting and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_DAEMON: 'false'
      NX_SKIP_NX_CACHE: 'true'
    steps:
      - name: Checkout (history for Nx affected)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute minimum required verification from changed files
        id: impact
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/impact-policy.mjs "$BASE_SHA" "$GITHUB_SHA"
      - name: Reuse established CI evidence (no Nx inputs changed)
        if: steps.impact.outputs.workspace == 'false'
        run: echo "Workspace task is not applicable to this commit; specialized workflows retain their own scope."
      - name: Install pnpm
        if: steps.impact.outputs.workspace == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.23.0
          run_install: false
      - name: Node.js
        if: steps.impact.outputs.workspace == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install from committed lockfile
        if: steps.impact.outputs.workspace == 'true'
        run: pnpm install --frozen-lockfile
      - name: Verify the installed deepmerge prototype guard
        if: steps.impact.outputs.workspace == 'true'
        run: node scripts/ci/verify-deepmerge-security.cjs
      - name: Display Nx projects
        if: steps.impact.outputs.workspace == 'true'
        run: pnpm exec nx show projects
      - name: Test changed projects in PR
        if: github.event_name == 'pull_request' && steps.impact.outputs.workspace == 'true' && steps.impact.outputs.decision == 'scoped'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec nx affected -t build typecheck test lint smoke --base="$BASE_SHA" --head=HEAD --parallel=3
      - name: Verify affected projects on main
        if: github.event_name == 'push' && steps.impact.outputs.workspace == 'true' && steps.impact.outputs.decision == 'scoped'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: pnpm exec nx affected -t build typecheck test lint smoke --base="$BASE_SHA" --head=HEAD --parallel=3
      - name: Fail-closed full project checks when the commit base is unavailable
        if: steps.impact.outputs.workspace == 'true' && steps.impact.outputs.decision == 'fail_closed'
        run: pnpm exec nx run-many -t build typecheck test lint smoke --parallel=3
# Specialized database, recovery and browser workflows remain independent security gates.


# TEMPORARY PR-only generator: removed before merge. It emits exact, pinned
# Spartan CLI files as an artifact for review; never writes to GitHub or host.
  spartan-scaffold-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'refactor/spartan-ui-modifiers-20261118' && github.event.pull_request.head.repo.full_name == github.repository
    name: Generate official Spartan Helm preview (PR only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.23.0
          run_install: false
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate pinned official Spartan Helm component sources
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec nx g @spartan-ng/cli:info --json
          for name in button card badge input label native-select separator dialog sheet tabs; do
            echo "=== SPARTAN GENERATE: $name ==="
            pnpm exec nx g @spartan-ng/cli:ui "$name" --interactive=false
          done
          pnpm install --lockfile-only
          git status --short
          git diff --name-only > /tmp/spartan-changed.txt
          git ls-files --others --exclude-standard >> /tmp/spartan-changed.txt
          sort -u /tmp/spartan-changed.txt > /tmp/spartan-files.txt
          test -s /tmp/spartan-files.txt
          tar czf spartan-scaffold.tar.gz -T /tmp/spartan-files.txt
      - name: Upload official Helm preview for review, no push
        uses: actions/upload-artifact@v4
        with:
          name: spartan-helm-official-preview
          path: spartan-scaffold.tar.gz
          retention-days: 1
          if-no-files-found: error
