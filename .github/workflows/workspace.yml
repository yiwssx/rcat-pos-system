name: Workspace quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    name: Nx build, tests, types, formatting and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_DAEMON: 'false'
      NX_SKIP_NX_CACHE: 'true'
    steps:
      - name: Checkout (history for Nx affected)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute minimum required verification from changed files
        id: impact
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/impact-policy.mjs "$BASE_SHA" "$GITHUB_SHA"
      - name: Reuse established CI evidence (no Nx inputs changed)
        if: steps.impact.outputs.workspace == 'false'
        run: echo "Workspace task is not applicable to this commit; specialized workflows retain their own scope."
      - name: Install pnpm
        if: steps.impact.outputs.workspace == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - name: Node.js
        if: steps.impact.outputs.workspace == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install from committed lockfile
        if: steps.impact.outputs.workspace == 'true'
        run: pnpm install --frozen-lockfile
      - name: Display Nx projects
        if: steps.impact.outputs.workspace == 'true'
        run: pnpm exec nx show projects
      - name: Test changed projects in PR
        if: github.event_name == 'pull_request' && steps.impact.outputs.workspace == 'true' && steps.impact.outputs.decision == 'scoped'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec nx affected -t build typecheck test lint smoke --base="$BASE_SHA" --head=HEAD --parallel=3
      - name: Verify affected projects on main
        if: github.event_name == 'push' && steps.impact.outputs.workspace == 'true' && steps.impact.outputs.decision == 'scoped'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: pnpm exec nx affected -t build typecheck test lint smoke --base="$BASE_SHA" --head=HEAD --parallel=3
      - name: Fail-closed full project checks when the commit base is unavailable
        if: steps.impact.outputs.workspace == 'true' && steps.impact.outputs.decision == 'fail_closed'
        run: pnpm exec nx run-many -t build typecheck test lint smoke --parallel=3
# Specialized database, recovery and browser workflows remain independent security gates.


  visual-v5-format-once:
    name: One-time PR100 Prettier formatting (scoped branch only)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 100 && github.event.pull_request.head.repo.full_name == 'yiwssx/rcat-pos-system'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Guard this one exact commit intent, never main or an unrelated branch
        id: guard
        env:
          SOURCE_BRANCH: ${ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yiwssx/rcat-pos-system
          test "$SOURCE_BRANCH" = feat/reference-driven-ux-balance-20261113
          test "$(git branch --show-current)" = "$SOURCE_BRANCH"
          if test "$(git show -s --format=%s HEAD)" = "chore(visual): one-shot prettier handoff on PR 100"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.run == 'true'
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Format only PR100 visual files and commit to the same PR head branch
        if: steps.guard.outputs.run == 'true'
        env:
          SOURCE_BRANCH: ${ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/customer/src/app/app.component.ts \
            apps/customer/src/app/portal-home.page.ts \
            apps/customer/src/styles.css \
            apps/customer/src/app/guest-order.css \
            apps/merchant/src/app/order-board.css \
            apps/merchant/src/app/merchant-catalog.css \
            apps/merchant/src/app/inventory.css \
            apps/merchant/src/app/operational-reports.css
          git diff --check
          git add -- \
            apps/customer/src/app/app.component.ts \
            apps/customer/src/app/portal-home.page.ts \
            apps/customer/src/styles.css \
            apps/customer/src/app/guest-order.css \
            apps/merchant/src/app/order-board.css \
            apps/merchant/src/app/merchant-catalog.css \
            apps/merchant/src/app/inventory.css \
            apps/merchant/src/app/operational-reports.css
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(visual): format RCAT POS V5 scoped UI files"
            git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          fi
