name: Workspace quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    name: Nx build, tests, types, formatting and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_DAEMON: 'false'
      NX_SKIP_NX_CACHE: 'true'
    steps:
      - name: Checkout (history for Nx affected)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute minimum required verification from changed files
        id: impact
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/impact-policy.mjs "$BASE_SHA" "$GITHUB_SHA"
      - name: Reuse established CI evidence (no Nx inputs changed)
        if: steps.impact.outputs.workspace == 'false'
        run: echo "Workspace task is not applicable to this commit; specialized workflows retain their own scope."
      - name: Install pnpm
        if: steps.impact.outputs.workspace == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.23.0
          run_install: false
      - name: Node.js
        if: steps.impact.outputs.workspace == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install from committed lockfile
        if: steps.impact.outputs.workspace == 'true'
        run: pnpm install --frozen-lockfile
      - name: Verify the installed deepmerge prototype guard
        if: steps.impact.outputs.workspace == 'true'
        run: node scripts/ci/verify-deepmerge-security.cjs
      - name: Display Nx projects
        if: steps.impact.outputs.workspace == 'true'
        run: pnpm exec nx show projects
      - name: Test changed projects in PR
        if: github.event_name == 'pull_request' && steps.impact.outputs.workspace == 'true' && steps.impact.outputs.decision == 'scoped'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec nx affected -t build typecheck test lint smoke --base="$BASE_SHA" --head=HEAD --parallel=3
      - name: Verify affected projects on main
        if: github.event_name == 'push' && steps.impact.outputs.workspace == 'true' && steps.impact.outputs.decision == 'scoped'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: pnpm exec nx affected -t build typecheck test lint smoke --base="$BASE_SHA" --head=HEAD --parallel=3
      - name: Fail-closed full project checks when the commit base is unavailable
        if: steps.impact.outputs.workspace == 'true' && steps.impact.outputs.decision == 'fail_closed'
        run: pnpm exec nx run-many -t build typecheck test lint smoke --parallel=3
# Specialized database, recovery and browser workflows remain independent security gates.


# TEMPORARY PR-only formatter: remove once official Helm source passes formatting.
  spartan-formatter:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'refactor/spartan-ui-modifiers-20261118' && github.event.pull_request.head.repo.full_name == github.repository
    name: Format official generated Helm source (one-time PR only)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and commit exact application/Helm delta
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          pnpm exec prettier --write 'libs/ui/src/spartan/**/*.ts' apps/merchant/src/app/merchant-catalog.page.ts
          if git diff --quiet -- libs/ui/src/spartan apps/merchant/src/app/merchant-catalog.page.ts; then
            echo "SPARTAN_FORMAT=ALREADY_CLEAN"
            exit 0
          fi
          git add libs/ui/src/spartan apps/merchant/src/app/merchant-catalog.page.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(ui): format official Spartan Helm and merchant Additional editor"
          FORMATTED_COMMIT="$(git rev-parse HEAD)"
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "refs/remotes/origin/$TARGET_BRANCH"
          git cherry-pick "$FORMATTED_COMMIT"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
