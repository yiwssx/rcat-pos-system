name: One-time RCAT V6 template formatter
on:
  push:
    branches: [feat/v6-pos-workspace-rebuild-thai-font-20261114]
    paths: [.github/workflows/v6-format-once.yml]
permissions:
  contents: write
concurrency:
  group: rcat-v6-format-once
  cancel-in-progress: true
jobs:
  format:
    if: github.repository == 'yiwssx/rcat-pos-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only four modified Angular HTML templates + angular config
        run: |
          pnpm exec prettier --write \
            apps/customer/src/app/portal-home.page.ts \
            apps/customer/src/app/guest-order.page.ts \
            apps/merchant/src/app/order-board.page.ts \
            apps/admin/src/app/home.page.ts \
            angular.json
      - name: Commit exact formatter result
        run: |
          git add -- \
            apps/customer/src/app/portal-home.page.ts \
            apps/customer/src/app/guest-order.page.ts \
            apps/merchant/src/app/order-board.page.ts \
            apps/admin/src/app/home.page.ts angular.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'style(v6): normalize four rewritten Angular templates'
          git fetch origin refs/heads/feat/v6-pos-workspace-rebuild-thai-font-20261114
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/feat/v6-pos-workspace-rebuild-thai-font-20261114
