name: Temporary G2 formatting
on:
  push:
    branches: [feat/g2-product-media-printable-table-qr]
    paths: ['.github/workflows/g2-format.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'yiwssx/rcat-pos-system' && github.ref == 'refs/heads/feat/g2-product-media-printable-table-qr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Restore frozen workspace dependencies without scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply pinned Prettier formatting to changed app sources
        run: |
          pnpm exec prettier --write 'apps/**/*.{ts,css,html}'
      - name: Commit formatting to same isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps
          git diff --cached --exit-code && exit 0
          git commit -m 'style(g2): apply workspace Prettier formatting'
          git push origin HEAD:refs/heads/feat/g2-product-media-printable-table-qr
