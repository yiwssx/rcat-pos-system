name: Feature request
description: Define new product functionality with testable acceptance criteria.
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and users
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed behavior and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and test evidence
    validations:
      required: true

