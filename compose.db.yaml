# Local development only; requires locally set POSTGRES_PASSWORD.
name: rcat-pos-dev
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rcat_dev_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development database password}
      POSTGRES_DB: rcat_pos_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rcat_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcat_dev_admin -d rcat_pos_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  rcat_pg_data:
