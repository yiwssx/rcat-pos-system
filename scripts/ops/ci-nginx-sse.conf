# Ephemeral loopback reverse-proxy integration fixture ONLY.
# Production TLS, hostnames and upstream topology require a separate review.
worker_processes 1;
pid /tmp/rcat-g4-nginx.pid;
error_log /tmp/rcat-g4-nginx-error.log warn;
events {
  worker_connections 256;
}
http {
  access_log off;  # No session cookies, QR tokens or query strings in CI logs.
  server {
    listen 127.0.0.1:31955;
    server_name localhost;

    location ~ ^/api/tenants/[0-9a-f-]+/stores/[0-9a-f-]+/notifications/stream$ {
      proxy_pass http://127.0.0.1:31949;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 45s;
      proxy_send_timeout 45s;
      proxy_connect_timeout 5s;
      add_header Cache-Control "no-store" always;
    }
    location /api/ {
      proxy_pass http://127.0.0.1:31949;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 20s;
      proxy_connect_timeout 5s;
    }
  }
}
