# Local demonstration only. Standalone: never merge with compose.staging.yaml.
name: rcat-pos-local

x-web: &web
  restart: unless-stopped
  depends_on:
    api:
      condition: service_healthy
  networks: [app_private]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs:
    - /var/cache/nginx:rw,nosuid,size=32m
    - /var/run:rw,nosuid,size=8m
  volumes:
    - ./infra/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ./infra/local/start.html:/usr/share/nginx/local/start.html:ro
    - ./.secrets/local-demo/cert.pem:/etc/nginx/local-tls/cert.pem:ro
    - ./.secrets/local-demo/key.pem:/etc/nginx/local-tls/key.pem:ro
  healthcheck:
    test: [CMD-SHELL, "wget --ca-certificate=/etc/nginx/local-tls/cert.pem --header='Host: localhost' -q -O /dev/null https://127.0.0.1:8080/local"]
    interval: 5s
    timeout: 5s
    retries: 12

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rcat_pos_local_demo
      POSTGRES_USER: rcat_local_dba
      POSTGRES_PASSWORD_FILE: /run/secrets/local_dba
    secrets: [local_dba]
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    networks: [database_private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rcat_local_dba -d rcat_pos_local_demo"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: rcat-pos-local-api:${RCAT_LOCAL_RELEASE:?Use local-demo.sh up}
    build:
      context: .
      dockerfile: Dockerfile.staging
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      ENABLE_DEVELOPMENT_AUTH: "true"
      PORT: "3000"
      RCAT_API_BIND_HOST: "0.0.0.0"
      AUTH_DATABASE_URL: postgresql://rcat_local_auth:${RCAT_LOCAL_AUTH_PASSWORD:?}@postgres:5432/rcat_pos_local_demo
      TENANT_DATABASE_URL: postgresql://rcat_local_tenant:${RCAT_LOCAL_TENANT_PASSWORD:?}@postgres:5432/rcat_pos_local_demo
      AUTH_ALLOWED_ORIGINS: https://localhost:11880,https://localhost:11881,https://localhost:11882
      CORS_ORIGINS: https://localhost:11880,https://localhost:11881,https://localhost:11882
      GUEST_TABLE_CODE_PEPPER: ${RCAT_LOCAL_PEPPER:?}
      GUEST_ORDER_BASE_URL: https://localhost:11880/order
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app_private, database_private]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  customer:
    <<: *web
    image: rcat-pos-local-customer:${RCAT_LOCAL_RELEASE:?}
    build:
      context: .
      dockerfile: Dockerfile.staging
      target: customer
    ports: ["127.0.0.1:11880:8080"]

  merchant:
    <<: *web
    image: rcat-pos-local-merchant:${RCAT_LOCAL_RELEASE:?}
    build:
      context: .
      dockerfile: Dockerfile.staging
      target: merchant
    ports: ["127.0.0.1:11881:8080"]

  admin:
    <<: *web
    image: rcat-pos-local-admin:${RCAT_LOCAL_RELEASE:?}
    build:
      context: .
      dockerfile: Dockerfile.staging
      target: admin
    ports: ["127.0.0.1:11882:8080"]

  migrator:
    image: postgres:16-bookworm
    profiles: [setup]
    entrypoint: [/bin/bash, -euo, pipefail, -c]
    command:
      - 'export PGPASSWORD="$$(cat /run/secrets/local_dba)"; exec bash /workspace/scripts/db/migrate.sh'
    environment:
      PGHOST: postgres
      PGDATABASE: rcat_pos_local_demo
      PGUSER: rcat_local_dba
    secrets: [local_dba]
    volumes:
      - ./db/migrations:/workspace/db/migrations:ro
      - ./scripts/db/migrate.sh:/workspace/scripts/db/migrate.sh:ro
    networks: [database_private]

  seed:
    image: rcat-pos-local-api:${RCAT_LOCAL_RELEASE:?}
    profiles: [setup]
    user: "0:0"
    entrypoint: [node, /work/scripts/dev/local-seed.mjs]
    environment:
      NODE_ENV: development
      RCAT_POS_LOCAL_DEMO: "true"
    secrets: [local_dba, local_auth, local_tenant, local_owner]
    volumes:
      - ./scripts/dev/local-seed.mjs:/work/scripts/dev/local-seed.mjs:ro
    networks: [database_private]
    read_only: true
    security_opt: ["no-new-privileges:true"]

secrets:
  local_dba:
    file: ./.secrets/local-demo/dba-password
  local_auth:
    file: ./.secrets/local-demo/auth-password
  local_tenant:
    file: ./.secrets/local-demo/tenant-password
  local_owner:
    file: ./.secrets/local-demo/owner-password

networks:
  app_private: {}
  database_private:
    internal: true

volumes:
  local_postgres_data: {}
